# MailPostA (mailposta): email sync for Claude Code (mail), plus a read-only web UI (web) behind a login (login, Caddy).
#
#   bin/setup               # data folders, starter rules, and .env from .env.example: fill that in
#   docker compose up -d    # Podman: podman-compose up -d. Pulls the published image; nothing to build.
# then open http://127.0.0.1:17203, log in with MAILPOSTA_LOGIN_USER and your password, and sign in to
# each Outlook account there. To build the image from this checkout instead (development):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Linux or macOS. On Windows, WSL2 is required: run everything inside WSL (Ubuntu) with Docker Desktop's
# WSL integration, and keep the project in the Linux filesystem (~/mailposta, not /mnt/c/...). Maildir
# file names contain ":", which Windows drives (NTFS) can't store.
#
# Data (bind mounts, all git-ignored; back up data/ and that's everything):
#   data/mail    local copies (Maildir), last RETENTION_DAYS days
#   data/state   sync state and Outlook sign-in tokens (only the mail service sees this)
#   data/index   notmuch tag/search index
#   data/logs    sync logs, run reports, bin/mail audit log (kept LOG_RETENTION_DAYS)
#   data/rules   your account kinds and tag rules
#   data/control requests from the web UI (sign in, test connection) and their results (no tokens)
# The ":z" on each mount relabels it for SELinux (RHEL/Fedora with podman) so both containers can read it.
name: mailposta

services:
  mail:
    # The published image (amd64 and arm64). Pin a version in .env, e.g. MAILPOSTA_IMAGE=ghcr.io/adrielleu/mailposta:0.2
    image: ${MAILPOSTA_IMAGE:-ghcr.io/adrielleu/mailposta:latest}
    container_name: mailposta-mail
    env_file: .env
    init: true
    # Default bridge: avoids a per-project network (and aardvark-dns on podman).
    network_mode: bridge
    restart: unless-stopped
    volumes:
      - ./data/mail:/mail:z
      - ./data/state:/state:z
      - ./data/index:/index:z
      # Sync logs, per-run reports and the bin/mail audit log; rotated after LOG_RETENTION_DAYS.
      - ./data/logs:/logs:z
      # Your tag rules and account kinds (read-only inside the container).
      - ./data/rules:/rules:ro,z
      # Requests from the web UI (Microsoft sign-in, connection test) in, their state out. Never tokens.
      - ./data/control:/control:z

  # Read-only web UI: browse and copy mail, tags, run reports, logs and rules. Same image, but no .env:
  # it gets no passwords or tokens, every folder is read-only, and it never sees data/state.
  web:
    image: ${MAILPOSTA_IMAGE:-ghcr.io/adrielleu/mailposta:latest}
    container_name: mailposta-web
    restart: unless-stopped
    depends_on: [mail]
    entrypoint: ["python3", "/opt/emailassist/webui"]
    environment:
      TZ: ${TZ:-America/Phoenix}
    network_mode: bridge
    # Only the login's port: login shares this container's network and listens on 80; the UI (8080) is
    # never published, so nothing reaches it without the login. This machine only by default; for your
    # local network set MAILPOSTA_BIND=0.0.0.0 in .env (plain HTTP: from outside, use a VPN).
    ports: ["${MAILPOSTA_BIND:-127.0.0.1}:${MAILPOSTA_PORT:-17203}:80"]
    volumes:
      - ./data/mail:/mail:ro,z
      - ./data/index:/index:ro,z
      - ./data/logs:/logs:ro,z
      - ./data/rules:/rules:ro,z
      # The web UI's only write access: asking the mail container to sign in or test a connection.
      - ./data/control/requests:/control/requests:z
      - ./data/control/status:/control/status:ro,z
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  login:
    image: docker.io/library/caddy:2.11.7-alpine
    container_name: mailposta-login
    restart: unless-stopped
    depends_on: [web]
    network_mode: "service:web"
    # The official Caddy image and the login from .env: MAILPOSTA_LOGIN_USER and MAILPOSTA_LOGIN_HASH
    # (bcrypt; how to make it: .env.example). Without them compose refuses to start, so your mail is never
    # served without the login.
    environment:
      TZ: ${TZ:-America/Phoenix}
      MAILPOSTA_LOGIN_USER: ${MAILPOSTA_LOGIN_USER:?set MAILPOSTA_LOGIN_USER in .env (see .env.example)}
      MAILPOSTA_LOGIN_HASH: ${MAILPOSTA_LOGIN_HASH:?set MAILPOSTA_LOGIN_HASH in .env (see .env.example)}
    # Its Caddyfile is written here, so the stack needs no files besides this one and .env. It shares the web
    # container's network: the UI is at 127.0.0.1:8080 and only Caddy's port 80 is published (MAILPOSTA_PORT).
    # Caddy fills in {$$...} from the environment above ($$ is compose's escape for $); it gets no mail.
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/Caddyfile <<'EOF'
        {
        	admin off
        	auto_https off
        }
        :80 {
        	basic_auth {
        		{$$MAILPOSTA_LOGIN_USER} {$$MAILPOSTA_LOGIN_HASH}
        	}
        	header {
        		X-Frame-Options "DENY"
        		-Server
        	}
        	reverse_proxy 127.0.0.1:8080
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    # Read-only, every Linux capability dropped except port 80 (the official caddy binary asks for it and
    # won't start without); its state is kept in memory (no certificates, no admin API).
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

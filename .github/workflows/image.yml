# Builds the mailposta image (amd64 + arm64) and publishes it to ghcr.io/<owner>/mailposta.
#   tag vX.Y.Z  -> :X.Y.Z, :X.Y and :latest
#   push to main -> :edge
#   pull request -> build only, nothing published
# The image has no secrets: .dockerignore keeps .env and data/ out of the build.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner for the image name and adds the OCI labels that link the package to this repo.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailposta
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Keep in step with HIMALAYA_VERSION in docker-compose.yml.
          build-args: HIMALAYA_VERSION=v2.2.1
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # For a v* tag, once the image is published: a GitHub release with that version's CHANGELOG section.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/mailposta
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 0; fi
          version="${TAG#v}"
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):$version"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
          {
            echo
            echo "### Image"
            echo '```sh'
            echo "docker pull $image   # amd64 and arm64"
            echo '```'
            echo "Or set \`MAILPOSTA_IMAGE=$image\` in \`.env\` and run \`docker compose pull mail web && docker compose up -d\`."
          } >> notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "MailPostA $version" --notes-file notes.md --verify-tag $prerelease

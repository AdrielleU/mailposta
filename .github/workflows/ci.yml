# Checks every push and pull request: lint the scripts, validate the compose file, then build the image
# and smoke-test it (tools present, configs render without secrets, SYNC_HOURS, web UI pages).
# Offline only: no real accounts, nothing syncs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -S warning bin/mail bin/setup scripts/prune docker/entrypoint.sh

      - name: Python syntax
        run: |
          for f in $(grep -l '^#!/usr/bin/env python3' scripts/*); do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done

      - name: Compose file
        env:
          MAILPOSTA_LOGIN_USER: ci
          MAILPOSTA_LOGIN_HASH: ci
        run: |
          touch .env
          docker compose config -q

  smoke:
    runs-on: ubuntu-latest
    env:
      IMAGE: mailposta:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f docker/Dockerfile -t "$IMAGE" .

      - name: Tools and config rendering
        run: |
          acct="-e ACCOUNTS=smoke -e SMOKE_TYPE=gmail -e SMOKE_ADDRESS=smoke@example.com -e SMOKE_DISPLAY_NAME=Smoke -e SMOKE_PASSWORD=ci-secret-7f3a"
          docker run --rm $acct "$IMAGE" sh -c '
            set -e
            himalaya --version
            mbsync --version
            notmuch --version
            himalaya account list
            if grep -r ci-secret-7f3a ~/.mbsyncrc ~/.config; then echo "secret written to a config file" >&2; exit 1; fi
          '

      - name: SYNC_HOURS
        run: |
          acct="-e ACCOUNTS=smoke -e SMOKE_TYPE=gmail -e SMOKE_ADDRESS=smoke@example.com -e SMOKE_DISPLAY_NAME=Smoke -e SMOKE_PASSWORD=x"
          for ok in "" 7-22 22-6 07-22 8-24; do
            docker run --rm $acct -e SYNC_HOURS="$ok" "$IMAGE" true || { echo "rejected valid SYNC_HOURS='$ok'" >&2; exit 1; }
          done
          for bad in 7-7 0-24 25-3 abc 7-22x; do
            if docker run --rm $acct -e SYNC_HOURS="$bad" "$IMAGE" true 2>/dev/null; then
              echo "accepted invalid SYNC_HOURS='$bad'" >&2; exit 1
            fi
          done

      - name: Web UI
        run: |
          mkdir -p ci/mail ci/logs ci/rules ci/index
          docker run -d --name web --entrypoint python3 \
            -v "$PWD/ci/mail:/mail:ro" -v "$PWD/ci/logs:/logs:ro" -v "$PWD/ci/rules:/rules:ro" -v "$PWD/ci/index:/index:ro" \
            "$IMAGE" /opt/emailassist/webui
          for i in $(seq 30); do docker exec web curl -fsS -o /dev/null http://127.0.0.1:8080/static/app.css && break; sleep 1; done
          for p in / /m /rules /static/app.css /static/app.js /static/logo.svg /favicon.ico; do
            docker exec web curl -fsS -o /dev/null "http://127.0.0.1:8080$p" || { echo "GET $p failed" >&2; docker logs web; exit 1; }
          done
          test "$(docker exec web curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404

      - name: Container logs
        if: failure()
        run: docker logs web 2>&1 || true
